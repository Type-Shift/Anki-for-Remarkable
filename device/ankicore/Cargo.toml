[package]
name = "ankicore"
version = "0.1.0"
edition = "2021"
description = "C shim over Anki's own Rust backend (rslib) for the reMarkable app"

# staticlib so the Qt app links it directly and ships as one binary; there is
# no package manager on the device to install a shared library into.
[lib]
crate-type = ["staticlib"]

[dependencies]
# rslib is the `anki` crate inside the Anki repo. Pinned to the same release
# the desktop runs (25.09.x), so collection schema and scheduling match
# exactly -- the whole point of using it rather than reimplementing.
anki = { git = "https://github.com/ankitects/anki", tag = "25.09.2" }
# rslib returns protobuf types from some calls (the deck tree, deck counts),
# and its own DeckId newtype is a DIFFERENT type from the protobuf DeckId.
# Both crates must be named to convert between them.
anki_proto = { git = "https://github.com/ankitects/anki", tag = "25.09.2" }
serde_json = "1"
regex = "1"

# Proper HTML entity decoding. Hand-rolling a handful of replacements missed
# everything else -- &ndash;, &mdash;, &bull;, &rsquo; and every numeric
# entity reached the screen as literal text. rslib already pulls this in, so
# it costs nothing to name it.
htmlescape = "0.3"

# Not used directly. Built standalone, rslib does not get the feature
# unification it gets inside Anki's own workspace, and tokio lands without
# "io-util": rslib's sync code then fails to find AsyncReadExt/read_to_end,
# and async-compression's ZstdDecoder loses the trait bounds it needs.
# Naming tokio here turns those features back on for the shared build.
tokio = { version = "1", features = [
    "io-util", "rt-multi-thread", "macros", "sync", "time", "net", "fs",
] }

# rslib's sync entry points take a reqwest::Client, and it must be the SAME
# reqwest rslib vendors or the types will not match. The build log shows it
# resolving 0.12.28, so naming the same major line lets Cargo unify them.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "json", "stream",
] }

[profile.release]
# The device has 477 MB of RAM and one core; favour size over speed.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
